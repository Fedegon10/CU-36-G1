spring.application.name=bolsines-cu36
# La API mock del GPS Tracker usa el 8080, por eso este backend corre en el 8081
server.port=8081

# ---------- Base de datos (H2 en archivo: los datos persisten entre reinicios) ----------
spring.datasource.url=jdbc:h2:file:./data/bolsinesdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- GPS Tracker (API mock provista por la catedra) ----------
gps.tracker.base-url=http://localhost:8080
